<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tidal Insurance Advisor</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="/tidal-insurance/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="/tidal-insurance/favicon-64.png" />
  <link rel="icon" type="image/x-icon" href="/tidal-insurance/favicon.ico" />
  <link rel="apple-touch-icon" href="/tidal-insurance/favicon.png" />
  <style>
    html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0; font-family: Georgia, "Times New Roman", serif; }
    .boot { display: grid; place-items: center; height: 100%; padding: 24px; text-align: center; }
    .boot h1 { font-weight: 500; letter-spacing: 0.02em; margin: 0 0 8px; font-size: 1.4rem; }
    .boot p { opacity: 0.8; margin: 0 0 16px; }
    .err { color: #fecaca; max-width: 36rem; }
    iframe { border: 0; width: 100%; height: 100%; display: block; background: #fff; }
  </style>
  <script src="/tidal-insurance/config.js"></script>
  <script>
    // Fallback when hosted at site root (pages.dev / custom domain)
    if (!window.TIDAL_CUSTOMER_PUBLIC) {
      var s = document.createElement('script');
      s.src = './config.js';
      document.head.appendChild(s);
    }
  </script>
</head>
<body>
  <div id="boot" class="boot">
    <div>
      <h1>Tidal Insurance Advisor</h1>
      <p>Preparing your secure journey…</p>
    </div>
  </div>
  <script src="/tidal-insurance/app.js"></script>
  <script>
    if (!window.__TIDAL_APP_LOADED__) {
      var a = document.createElement('script');
      a.src = './app.js';
      document.body.appendChild(a);
    }
  </script>
</body>
</html>
